<svg width="600px" height="420px" viewBox="0 0 600 420" xmlns="http://www.w3.org/2000/svg">
    <title>Component Interaction Flow with Test Generator</title>
    <defs>
        <marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
        </marker>
        <marker id="arrowhead-alt" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#c93"/>
        </marker>
    </defs>
    <style>
        .box { stroke: #333; stroke-width: 1.5; rx: 5; ry: 5; }
        .text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 16px; text-anchor: middle; dominant-baseline: central; fill: #111; }
        .label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 14px; text-anchor: middle; fill: #333; }
        .line { fill: none; stroke: #333; stroke-width: 1.5; marker-end: url(#arrowhead); }
        .alt-line { fill: none; stroke: #c93; stroke-width: 2; marker-end: url(#arrowhead-alt); stroke-dasharray: 6, 4; }
    </style>

    <!-- Nodes -->
    <g id="user">
        <rect x="40" y="10" width="100" height="50" class="box" fill="#cde4ff"/>
        <text x="90" y="35" class="text">User</text>
    </g>
    <g id="test-generator">
        <rect x="420" y="10" width="140" height="50" class="box" fill="#ffeeba"/>
        <text x="490" y="35" class="text">Test Generator</text>
    </g>
    <g id="dashboard">
        <rect x="40" y="150" width="160" height="50" class="box" fill="#d1ecf1"/>
        <text x="120" y="175" class="text">Web Dashboard</text>
    </g>
    <g id="proxy">
        <rect x="360" y="150" width="160" height="50" class="box" fill="#d1ecf1"/>
        <text x="440" y="175" class="text">Monitoring Proxy</text>
    </g>
    <g id="ollama">
        <rect x="200" y="320" width="160" height="50" class="box" fill="#d4edda"/>
        <text x="280" y="345" class="text">Ollama API</text>
    </g>

    <!-- Main User Flow Edges -->
    <path d="M 90 60 V 150" class="line" />
    <text x="60" y="105" class="label">1.</text>

    <path d="M 200 175 H 360" class="line" />
    <text x="280" y="160" class="label">2.</text>

    <path d="M 360 165 H 200" class="line" />
    <text x="280" y="190" class="label">5.</text>

    <path d="M 120 150 V 60" class="line" />
    <text x="150" y="105" class="label">6.</text>

    <!-- Shared Flow -->
    <path d="M 440 200 V 250 C 440 290 280 300 280 320" class="line" />
    <text x="380" y="270" class="label">3. Forwards to API</text>

    <path d="M 280 370 L 280 400 L 540 400 L 540 200" class="line" />
    <text x="440" y="380" class="label">4. Receives response</text>

    <!-- Alt Test Generator Flow -->
    <path d="M 490 60 V 150" class="alt-line" />
    <text x="525" y="105" class="label" fill="#c93">Load Test</text>
</svg>
