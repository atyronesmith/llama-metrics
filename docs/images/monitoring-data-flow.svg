<svg width="600px" height="320px" viewBox="0 0 600 320" xmlns="http://www.w3.org/2000/svg">
    <title>Monitoring Data Flow</title>
    <defs>
        <marker id="arrowhead-monitoring" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
        </marker>
    </defs>
    <style>
        .box { stroke: #333; stroke-width: 1.5; rx: 5; ry: 5; }
        .text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 16px; text-anchor: middle; dominant-baseline: central; fill: #111; }
        .label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 14px; text-anchor: middle; fill: #333; }
        .line { fill: none; stroke: #333; stroke-width: 1.5; marker-end: url(#arrowhead-monitoring); }
    </style>

    <!-- Nodes -->
    <g id="proxy">
        <rect x="10" y="115" width="160" height="50" class="box" fill="#cde4ff"/>
        <text x="90" y="140" class="text">Monitoring Proxy</text>
    </g>
    <g id="prometheus">
        <rect x="220" y="20" width="160" height="50" class="box" fill="#f8d7da"/>
        <text x="300" y="45" class="text">Prometheus</text>
    </g>
    <g id="dashboard">
        <rect x="220" y="210" width="160" height="50" class="box" fill="#d1ecf1"/>
        <text x="300" y="235" class="text">Web Dashboard</text>
    </g>
    <g id="operator">
        <rect x="430" y="115" width="160" height="50" class="box" fill="#cde4ff"/>
        <text x="510" y="140" class="text">Operator/User</text>
    </g>

    <!-- Edges -->
    <path d="M 90 115 V 70 C 90 45 220 45 220 45" class="line" />
    <text x="175" y="60" class="label">1. Exposes /metrics</text>

    <path d="M 220 45 L 90 45 C 70 45 70 115 70 115" class="line" />
    <text x="165" y="90" class="label">2. Scrapes metrics</text>

    <path d="M 300 70 V 210" class="line" />
    <text x="365" y="140" class="label">3. Queries metrics</text>

    <path d="M 380 235 H 510" class="line" />
    <text x="445" y="225" class="label">4. Views dashboard</text>
</svg>
