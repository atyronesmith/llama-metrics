<!-- Queue Management Section -->
<div class="row mb-4">
    <div class="col-12">
        <div class="metrics-section">
            <h5><i class="bi bi-hourglass-split"></i> Queue Management</h5>
            <div class="row">
                <div class="col mb-3">
                    <div class="card metric-card card-primary h-100" title="Prometheus Query: sum(ollama_proxy_active_requests)">
                        <div class="card-body text-center">
                            <div class="metric-value" id="active-requests">0</div>
                            <div class="metric-label">
                                <i class="bi bi-activity"></i> Active
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col mb-3">
                    <div class="card metric-card card-warning h-100" title="Prometheus Query: ollama_proxy_queue_size">
                        <div class="card-body text-center">
                            <div class="metric-value" id="queue-size">0</div>
                            <div class="metric-label">
                                <i class="bi bi-hourglass-split"></i> Queue
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col mb-3">
                    <div class="card metric-card card-info h-100" title="Prometheus Query: ollama_proxy_queue_processing_rate">
                        <div class="card-body text-center">
                            <div class="metric-value" id="queue-processing-rate">0.0</div>
                            <div class="metric-label">
                                <i class="bi bi-speedometer"></i> Rate/sec
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col mb-3">
                    <div class="card metric-card card-danger h-100" title="Prometheus Query: ollama_proxy_queue_peak_size">
                        <div class="card-body text-center">
                            <div class="metric-value" id="max-queue-size">0</div>
                            <div class="metric-label">
                                <i class="bi bi-graph-up-arrow"></i> Peak
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col mb-3">
                    <div class="card metric-card card-success h-100" title="Queue efficiency calculated as (processing rate / queue size) * 100">
                        <div class="card-body text-center">
                            <div class="metric-value" id="queue-efficiency">100%</div>
                            <div class="metric-label">
                                <i class="bi bi-check-circle"></i> Efficiency
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col mb-3">
                    <div class="card metric-card card-danger h-100" title="High priority requests processed and successful">
                        <div class="card-body text-center">
                            <div class="metric-value" id="high-priority-combined">0/0</div>
                            <div class="metric-label">
                                <i class="bi bi-exclamation-triangle"></i> High Pri
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col mb-3">
                    <div class="card metric-card card-primary h-100" title="Normal priority requests processed and successful">
                        <div class="card-body text-center">
                            <div class="metric-value" id="normal-priority-combined">0/0</div>
                            <div class="metric-label">
                                <i class="bi bi-list-ul"></i> Normal Pri
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Latency Performance Metrics within Queue Section -->
            <div class="row mt-3">
                <div class="col-md-6">
                    <div class="card h-100" title="Prometheus Query: histogram_quantile(0.5/0.75/0.95/0.99, rate(ollama_proxy_request_duration_seconds_bucket[5m]))">
                        <div class="card-header">
                            <h6 class="mb-0"><i class="bi bi-bar-chart"></i> Latency Percentiles</h6>
                        </div>
                        <div class="card-body">
                            <div class="row text-center">
                                <div class="col-3">
                                    <div class="h5 mb-0" id="p50">0.0s</div>
                                    <small class="text-muted">P50</small>
                                </div>
                                <div class="col-3">
                                    <div class="h5 mb-0" id="p75">0.0s</div>
                                    <small class="text-muted">P75</small>
                                </div>
                                <div class="col-3">
                                    <div class="h5 mb-0" id="p95">0.0s</div>
                                    <small class="text-muted">P95</small>
                                </div>
                                <div class="col-3">
                                    <div class="h5 mb-0" id="p99">0.0s</div>
                                    <small class="text-muted">P99</small>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="card h-100" title="Prometheus Query: histogram_quantile(0.5/0.75/0.95/0.99, rate(ollama_proxy_high_priority_request_duration_seconds_bucket[5m]))">
                        <div class="card-header">
                            <h6 class="mb-0"><i class="bi bi-lightning-fill text-warning"></i> High Priority Latency</h6>
                        </div>
                        <div class="card-body">
                            <div class="row text-center">
                                <div class="col-3">
                                    <div class="h5 mb-0" id="hp_p50">0.0s</div>
                                    <small class="text-muted">P50</small>
                                </div>
                                <div class="col-3">
                                    <div class="h5 mb-0" id="hp_p75">0.0s</div>
                                    <small class="text-muted">P75</small>
                                </div>
                                <div class="col-3">
                                    <div class="h5 mb-0" id="hp_p95">0.0s</div>
                                    <small class="text-muted">P95</small>
                                </div>
                                <div class="col-3">
                                    <div class="h5 mb-0" id="hp_p99">0.0s</div>
                                    <small class="text-muted">P99</small>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
